name: Despliegue en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro merge, el que está en curso termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Toma la versión de "packageManager" en package.json (pnpm 11.10.0).
      - uses: pnpm/action-setup@v6

      # Toma la versión de .nvmrc (Node 24).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Da la ruta base del sitio: "/<repositorio>" o "" si hay dominio propio.
      - id: pages
        uses: actions/configure-pages@v6

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # GitHub Pages no conoce las rutas del navegador: 404.html sirve la app
      # cuando se abre directamente una ruta como /obra o /cotizar.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
